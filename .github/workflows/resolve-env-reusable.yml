---
name: Check PR Source Branch (2 Environments) (Reusable)

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Checking PR: $SOURCE_BRANCH -> $TARGET_BRANCH"

          # Fixed 2-environment setup: main (prod) <- develop (dev)
          case "$TARGET_BRANCH" in
            main)
              ALLOWED_BRANCH="develop"
              ;;
            develop)
              echo "Target 'develop' is the lowest environment branch. Any source is allowed."
              exit 0
              ;;
            *)
              echo "Target branch '$TARGET_BRANCH' is not a managed environment branch. Skipping check."
              exit 0
              ;;
          esac

          if [[ "$SOURCE_BRANCH" == "$ALLOWED_BRANCH" || "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "Source branch '$SOURCE_BRANCH' is allowed for '$TARGET_BRANCH'."
          else
            echo "Error: Pull requests to '$TARGET_BRANCH' are only allowed from '$ALLOWED_BRANCH' or 'hotfix/*' branches."
            exit 1
          fi
