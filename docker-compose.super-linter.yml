---
services:
  linter:
    image: "ghcr.io/super-linter/super-linter:slim-v9.0.0"
    platform: linux/amd64
    environment:
      - RUN_LOCAL=true
      - SHELL=/bin/bash
      - DEFAULT_BRANCH=main
      - LINTER_RULES_PATH=./
      - VALIDATE_ALL_CODEBASE=false
    env_file:
      - .github/super-linter.env
    volumes:
      - ${PWD}:/tmp/lint
